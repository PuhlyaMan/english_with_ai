<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1d4ed8">
    <title>Offline — EasyEnglish</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #f3f6fb;
        color: #0f172a;
      }
      main {
        width: min(28rem, calc(100% - 2rem));
        padding: 1.5rem;
        background: #fff;
        border: 1px solid #dbe3ef;
        border-radius: 1rem;
      }
      h1 { margin: 0 0 0.5rem; font-size: 1.5rem; }
      p { margin: 0 0 1rem; line-height: 1.5; }
      a { color: #1d4ed8; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>EasyEnglish could not open that page. The home screen is still available from the app cache.</p>
      <p><a href="./">Back to EasyEnglish</a></p>
    </main>
  </body>
</html>
